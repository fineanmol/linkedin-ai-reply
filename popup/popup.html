<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn AI Reply Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">AI Reply</span>
          <span class="logo-subtitle">LinkedIn Assistant</span>
        </div>
      </div>
      <label class="toggle" aria-label="Enable extension">
        <input type="checkbox" id="enabled-toggle">
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Status Card -->
    <div class="status-card" id="status-card">
      <div class="status-row">
        <span class="status-dot" id="ollama-dot"></span>
        <span class="status-label" id="ollama-label">Checking Ollama…</span>
        <span class="status-model" id="current-model"></span>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-num" id="stat-generated">—</span>
        <span class="stat-label">Generated</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="stat-approved">—</span>
        <span class="stat-label">Approved</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="stat-samples">—</span>
        <span class="stat-label">Style Samples</span>
      </div>
    </div>

    <!-- Setup Warning (shown when Ollama is down) -->
    <div class="setup-hint" id="setup-hint" hidden>
      <div class="hint-icon">⚠️</div>
      <div class="hint-content">
        <strong>Ollama not running</strong>
        <p>Start it with <code>ollama serve</code></p>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="open-options">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings & Style Profile</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="ext-version">v1.0.2</span>
      <span>·</span>
      <span>Privacy-first · Local AI</span>
    </footer>

  </div>
  <script src="popup.bundle.js"></script>
</body>
</html>
